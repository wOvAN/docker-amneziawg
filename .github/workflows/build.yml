name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get latest AWG release tag
        id: awg
        run: |
          TAG=$(curl -s https://api.github.com/repos/amnezia-vpn/amneziawg-tools/releases/latest | jq -r .tag_name)
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Compose image tags
        id: tags
        env:
          AWG_TAG: ${{ steps.awg.outputs.tag }}
        run: |
          compose() {
            {
              printf '%s:latest\n' "$1"
              printf '%s:%s\n' "$1" "${AWG_TAG}"
              # repo tag (e.g. v1.0) becomes an extra immutable image tag; skip if same as upstream version
              if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${AWG_TAG}" ]]; then
                printf '%s:%s\n' "$1" "${GITHUB_REF_NAME}"
              fi
            } > "$2"
          }
          compose ghcr.io/wovan/docker-amneziawg /tmp/tags-ghcr
          compose wovan/amneziawg /tmp/tags-hub
          {
            printf 'ghcr<<EOF\n'; cat /tmp/tags-ghcr; printf 'EOF\n'
            printf 'hub<<EOF\n'; cat /tmp/tags-hub; printf 'EOF\n'
          } >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (GHCR)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            AWG_RELEASE=${{ steps.awg.outputs.tag }}
            VERSION=${{ steps.awg.outputs.tag }}
          push: true
          tags: ${{ steps.tags.outputs.ghcr }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Docker Hub push needs DOCKERHUB_USERNAME/DOCKERHUB_TOKEN repo secrets;
      # without them this step is skipped and only GHCR gets the image.
      - name: Login Docker Hub
        if: env.HUB_TOKEN != ''
        env:
          HUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.HUB_USERNAME }}
          password: ${{ env.HUB_TOKEN }}

      - name: Build and push (Docker Hub)
        if: env.HUB_TOKEN != ''
        env:
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            AWG_RELEASE=${{ steps.awg.outputs.tag }}
            VERSION=${{ steps.awg.outputs.tag }}
          push: true
          tags: ${{ steps.tags.outputs.hub }}
          cache-from: type=gha
