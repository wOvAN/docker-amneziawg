# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  IMAGE: awg-test
  AWG_RELEASE: v3.1.20260814
  AWG_TOOLS_RELEASE: v3.1.20260812

tasks:
  default:
    desc: Build the image locally
    cmds:
      - task: build

  build:
    desc: Build the image locally (multi-stage, pins AWG_RELEASE and AWG_TOOLS_RELEASE)
    cmds:
      - docker build --pull -t {{.IMAGE}} --build-arg AWG_RELEASE={{.AWG_RELEASE}} --build-arg AWG_TOOLS_RELEASE={{.AWG_TOOLS_RELEASE}} .
