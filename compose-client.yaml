# Example: run the image as an AmneziaWG VPN CLIENT.
# Drop one or more .conf files into ./client-config/wg_confs/ and start.
# Usage: docker compose -f client-compose.yaml up -d
services:
  amneziawg-client:
    image: ghcr.io/wovan/docker-amneziawg:latest
    container_name: amneziawg-client
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./client-config:/config   # put your confs in ./client-config/wg_confs/
      - /lib/modules:/lib/modules:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    # no ports: the tunnel is outbound-only from this container
    restart: unless-stopped
