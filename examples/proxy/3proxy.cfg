# 3proxy configuration — SOCKS5 + HTTP proxy through AmneziaWG tunnel.
# Mounted into the 3proxy container at /etc/3proxy/3proxy.cfg.

# Logging
logger /var/log/3proxy/3proxy.log
logformat "- +_L%t.%. %N.%P %E %U %C:%s %c:%p %O:%o %R:%r %D:%d %b %a %T"
logdaily 0
rotate 7

# DNS: use the VPN tunnel's DNS resolver (set by the WireGuard conf)
# Fallback to Cloudflare if the tunnel isn't up yet.
nscache
nslisten 127.0.0.1
maxconn 4096

# Allow connections from the host and local network
allow 127.0.0.1
allow 10.0.0.0/8
allow 172.16.0.0/12
allow 192.168.0.0/16

# SOCKS5 proxy — port 1080, bound to all interfaces visible in the shared
# network namespace (including the host-facing bridge IP).
socks -p1080 -a

# HTTP proxy — port 3128
http -p3128 -a

# HTTP proxy with authentication (uncomment to enable):
# auth strong
# users: `echo -n 'user:password' | base64` → add to /etc/3proxy/auth.ini
# htpasswd -c /etc/3proxy/auth.ini user
