---

# jenkins variables
project_name: docker-amneziawg
external_type: github_commit
release_type: stable
release_tag: latest
ls_branch: master
repo_vars:
  - CONTAINER_NAME = 'amneziawg'
  - BUILD_VERSION_ARG = 'AWG_RELEASE'
  - LS_USER = 'amnezia-vpn'
  - LS_REPO = 'amneziawg-tools'
  - REPO_URL = 'https://github.com/amnezia-vpn/amneziawg-tools.git'
  - DOCKERHUB_IMAGE = 'wovan/amneziawg'
  - DEV_DOCKERHUB_IMAGE = 'wovandev/amneziawg'
  - PR_DOCKERHUB_IMAGE = 'wovan/amneziawg-pr'
  - MULTIARCH='true'
  - CI='false'
  - CI_WEB='false'
  - CI_PORT='8080'
  - CI_SSL='false'
  - CI_DELAY='60'
  - CI_DOCKERENV=''
  - CI_AUTH=''
  - CI_WEBPATH=''
sponsor_links:
  - { name: "Amnezia", url: "https://amnezia.org/en/donate" }
