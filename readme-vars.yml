---

# project information
project_name: amneziawg
project_url: "https://github.com/amnezia-vpn/amneziawg-go"
project_logo: "https://avatars.githubusercontent.com/u/74861536?v=4"
project_blurb: "**This is a fork of [linuxserver/docker-wireguard](https://github.com/linuxserver/docker-wireguard) with the VPN engine replaced by [AmneziaWG]({{ project_url }}) (AWG 3.1)** — the management approach (env vars, templates, peer/QR flow, s6 services) is unchanged, only the tooling differs (`awg`/`awg-quick`/`amneziawg-go` instead of `wg`/`wg-quick`) and generated confs carry AWG 3.1 obfuscation parameters. AmneziaWG is a contemporary version of the WireGuard protocol, a fork of WireGuard-Go that offers protection against detection by Deep Packet Inspection (DPI) systems. It retains the simplified architecture and high performance of the original while adding advanced obfuscation methods (junk packets, message padding, header protection, content padding and randomized timings), allowing its traffic to blend seamlessly with regular internet traffic. The image runs as an amneziawg server or client via `awg`/`awg-quick`, using the kernel module when available and falling back to the amneziawg-go userspace implementation."
project_lsio_github_repo_url: "https://github.com/wOvAN/docker-amneziawg"
project_categories: "Network,VPN"
# supported architectures
available_architectures:
  - {arch: "{{ arch_x86_64 }}", tag: "amd64-latest"}
  - {arch: "{{ arch_arm64 }}", tag: "arm64v8-latest"}
# container parameters
common_param_env_vars_enabled: true
param_container_name: "{{ project_name }}"
param_usage_include_vols: true
param_volumes:
  - {vol_path: "/config", vol_host_path: "/path/to/{{ project_name }}/config", desc: "Contains all relevant configuration files."}
opt_param_usage_include_vols: true
opt_param_volumes:
  - {vol_path: "/lib/modules", vol_host_path: "/lib/modules", desc: "Path to host kernel module for situations where it's not already loaded."}
param_usage_include_ports: true
param_ports:
  - {external_port: "51820", internal_port: "51820/udp", port_desc: "amneziawg port"}
cap_add_param: true
cap_add_param_vars:
  - {cap_add_var: "NET_ADMIN", desc: "Neccessary for AmneziaWG to create its VPN interface."}
opt_cap_add_param: true
opt_cap_add_param_vars:
  - {cap_add_var: "SYS_MODULE", desc: "Neccessary for loading AmneziaWG kernel module if it's not already loaded."}
custom_params:
  - {name: "sysctl", name_compose: "sysctls", value: ["net.ipv4.conf.all.src_valid_mark=1"], desc: "Required for client mode.", array: "true"}
# optional container parameters
opt_param_usage_include_env: true
opt_param_env_vars:
  - {env_var: "SERVERURL", env_value: "wireguard.domain.com", desc: "External IP or domain name for docker host. Used in server mode. If set to `auto`, the container will try to determine and set the external IP automatically"}
  - {env_var: "SERVERPORT", env_value: "51820", desc: "External port for docker host. Used in server mode."}
  - {env_var: "PEERS", env_value: "1", desc: "Number of peers to create confs for. Required for server mode. Can also be a list of names: `myPC,myPhone,myTablet` (alphanumeric only)"}
  - {env_var: "PEERDNS", env_value: "auto", desc: "DNS server set in peer/client configs (can be set as `8.8.8.8`). Used in server mode. Defaults to `auto`, which uses docker host's DNS via included CoreDNS forward."}
  - {env_var: "INTERNAL_SUBNET", env_value: "10.13.13.0", desc: "Internal subnet for the amneziawg and server and peers (only change if it clashes). Used in server mode."}
  - {env_var: "ALLOWEDIPS", env_value: "0.0.0.0/0", desc: "The IPs/Ranges that the peers will be able to reach using the VPN connection. If not specified the default value is: '0.0.0.0/0, ::0/0' This will cause ALL traffic to route through the VPN, if you want split tunneling, set this to only the IPs you would like to use the tunnel AND the ip of the server's awg ip, such as 10.13.13.1."}
  - {env_var: "PERSISTENTKEEPALIVE_PEERS", env_value: "", desc: "Set to `all` or a list of comma separated peers (ie. `1,4,laptop`) for the amneziawg server to send keepalive packets to listed peers every 25 seconds. Useful if server is accessed via domain name and has dynamic IP. Used only in server mode."}
  - {env_var: "LOG_CONFS", env_value: "true", desc: "Generated QR codes will be displayed in the docker log. Set to `false` to skip log output."}
readonly_supported: true
readonly_message: |
  * Not supported in client mode.
# application setup block
app_setup_block_enabled: true
app_setup_block: |
  During container start, it will first check if the amneziawg kernel module is already installed and loaded. If it is not, the container will fall back to the amneziawg-go userspace implementation, which requires the `/dev/net/tun` device to be passed through to the container (`--device=/dev/net/tun`). The amneziawg kernel module is not built into stock kernels, so most users will run on the userspace implementation.

  This image generates server and peer configs with AmneziaWG 3.1 obfuscation parameters (junk packets `Jc`/`Jmin`/`Jmax`, message padding `S1`-`S4`, magic headers `H1`-`H4`, `HeaderProtectionKey`, content padding, randomized rekey/keepalive timings, an `I1` CPS protocol-imitation signature that prefixes handshake packets with fake DNS traffic so they blend in with regular internet traffic, `RandomTrailers` which appends a random number of bytes to the end of each packet, and `DisableCookies` which suppresses handshake cookie replies) which are randomly generated once per server and shared between the server and peer configs, just like the server keys. The generated peer configs can be imported into the Amnezia VPN clients (desktop, mobile, iOS).

  This can be run as a server or a client, based on the parameters used.

  ## Note on iptables

  Some hosts may not load the iptables kernel modules by default. In order for the container to be able to load them, you need to assign the `SYS_MODULE` capability and add the optional `/lib/modules` volume mount. Alternatively you can `modprobe` them from the host before starting the container.

  ## Server Mode

  If the environment variable `PEERS` is set to a number or a list of strings separated by comma, the container will run in server mode and the necessary server and peer/client confs will be generated. The peer/client config qr codes will be output in the docker log if `LOG_CONFS` is set to `true`. They will also be saved in text and png format under `/config/peerX` in case `PEERS` is a variable and an integer or `/config/peer_X` in case a list of names was provided instead of an integer.

  Variables `SERVERURL`, `SERVERPORT`, `INTERNAL_SUBNET`, `PEERDNS`, `INTERFACE`, `ALLOWEDIPS` and `PERSISTENTKEEPALIVE_PEERS` are optional variables used for server mode. Any changes to these environment variables will trigger regeneration of server and peer confs. Peer/client confs will be recreated with existing private/public keys. Delete the peer folders for the keys to be recreated along with the confs.

  To add more peers/clients later on, you increment the `PEERS` environment variable or add more elements to the list and recreate the container.

  To display the QR codes of active peers again, you can use the following command and list the peer numbers as arguments: `docker exec -it wireguard /app/show-peer 1 4 5` or `docker exec -it wireguard /app/show-peer myPC myPhone myTablet` (Keep in mind that the QR codes are also stored as PNGs in the config folder).

  The templates used for server and peer confs are saved under `/config/templates`. Advanced users can modify these templates and force conf generation by deleting `/config/wg_confs/wg0.conf` and restarting the container.

  The AmneziaWG 3.1 obfuscation parameters are randomly generated once per server (along with the server keys) and stored in `/config/server/awgparams`. Both templates reference this file with a `$(cat /config/server/awgparams)` line, so the same parameters end up in the server conf and all peer confs (S1-S4, H1-H4, I1, HeaderProtectionKey, RandomTrailers and DisableCookies must match between server and clients). Advanced users can replace that line in a template with explicit values, or edit the awgparams file and delete wg0.conf to regenerate the confs.

  The container managed server conf is hardcoded to `wg0.conf`. However, the users can add additional tunnel config files with `.conf` extensions into `/config/wg_confs/` and the container will attempt to start them all in alphabetical order. If any one of the tunnels fail, they will all be stopped and the default route will be deleted, requiring user intervention to fix the invalid conf and a container restart.

  ## Client Mode

  Do not set the `PEERS` environment variable. Drop your client conf(s) into the config folder as `/config/wg_confs/<tunnel name>.conf` and start the container. If there are multiple tunnel configs, the container will attempt to start them all in alphabetical order. If any one of the tunnels fail, they will all be stopped and the default route will be deleted, requiring user intervention to fix the invalid conf and a container restart.

  If you get IPv6 related errors in the log and connection cannot be established, edit the `AllowedIPs` line in your peer/client wg0.conf to include only `0.0.0.0/0` and not `::/0`; and restart the container.

  ## Road warriors, roaming and returning home

  If you plan to use AmneziaWG both remotely and locally, say on your mobile phone, you will need to consider routing. Most firewalls will not route ports forwarded on your WAN interface correctly to the LAN out of the box. This means that when you return home, even though you can see the AmneziaWG server, the return packets will probably get lost.

  This is not an AmneziaWG specific issue and the two generally accepted solutions are NAT reflection (setting your edge router/firewall up in such a way as it translates internal packets correctly) or split horizon DNS (setting your internal DNS to return the private rather than public IP when connecting locally).

  Both of these approaches have positives and negatives however their setup is out of scope for this document as everyone's network layout and equipment will be different.

  ## Maintaining local access to attached services

  ** Note: This is not a supported configuration by Linuxserver.io - use at your own risk.

  When routing via AmneziaWG from another container using the `service` option in docker, you might lose access to the containers webUI locally. To avoid this, exclude the docker subnet from being routed via AmneziaWG by modifying your `wg0.conf` like so (modifying the subnets as you require):

    ```ini
    [Interface]
    PrivateKey = <private key>
    Address = 9.8.7.6/32
    DNS = 8.8.8.8
    PostUp = DROUTE=$(ip route | grep default | awk '{print $3}'); HOMENET=192.168.0.0/16; HOMENET2=10.0.0.0/8; HOMENET3=172.16.0.0/12; ip route add $HOMENET3 via $DROUTE;ip route add $HOMENET2 via $DROUTE; ip route add $HOMENET via $DROUTE;iptables -I OUTPUT -d $HOMENET -j ACCEPT;iptables -A OUTPUT -d $HOMENET2 -j ACCEPT; iptables -A OUTPUT -d $HOMENET3 -j ACCEPT;  iptables -A OUTPUT ! -o %i -m mark ! --mark $(awg show %i fwmark) -m addrtype ! --dst-type LOCAL -j REJECT
    PreDown = DROUTE=$(ip route | grep default | awk '{print $3}'); HOMENET=192.168.0.0/16; HOMENET2=10.0.0.0/8; HOMENET3=172.16.0.0/12; ip route del $HOMENET3 via $DROUTE;ip route del $HOMENET2 via $DROUTE; ip route del $HOMENET via $DROUTE; iptables -D OUTPUT ! -o %i -m mark ! --mark $(awg show %i fwmark) -m addrtype ! --dst-type LOCAL -j REJECT; iptables -D OUTPUT -d $HOMENET -j ACCEPT; iptables -D OUTPUT -d $HOMENET2 -j ACCEPT; iptables -D OUTPUT -d $HOMENET3 -j ACCEPT
    ```

  ## Site-to-site VPN

  ** Note: This is not a supported configuration by Linuxserver.io - use at your own risk.

  Site-to-site VPN in server mode requires customizing the `AllowedIPs` statement for a specific peer in `wg0.conf`. Since `wg0.conf` is autogenerated when server vars are changed, it is not recommended to edit it manually.

  In order to customize the `AllowedIPs` statement for a specific peer in `wg0.conf`, you can set an env var `SERVER_ALLOWEDIPS_PEER_<peer name or number>` to the additional subnets you'd like to add, comma separated and excluding the peer IP (ie. `"192.168.1.0/24,192.168.2.0/24"`). Replace `<peer name or number>` with either the name or number of a peer (whichever is used in the `PEERS` var).

  For instance `SERVER_ALLOWEDIPS_PEER_laptop="192.168.1.0/24,192.168.2.0/24"` will result in the wg0.conf entry `AllowedIPs = 10.13.13.2,192.168.1.0/24,192.168.2.0/24` for the peer named `laptop`.

  Keep in mind that this var will only be considered when the confs are regenerated. Adding this var for an existing peer won't force a regeneration. You can delete wg0.conf and restart the container to force regeneration if necessary.

  Don't forget to set the necessary POSTUP and POSTDOWN rules in your client's peer conf for lan access.
# init diagram
init_diagram: |
  "wireguard:latest": {
    docker-mods
    base {
      fix-attr +\nlegacy cont-init
    }
    docker-mods -> base
    legacy-services
    custom services
    init-services -> legacy-services
    init-services -> custom services
    custom services -> legacy-services
    legacy-services -> ci-service-check
    init-migrations -> init-adduser
    init-os-end -> init-config
    init-config -> init-config-end
    init-crontab-config -> init-config-end
    init-wireguard-confs -> init-config-end
    init-config -> init-crontab-config
    init-mods-end -> init-custom-files
    init-adduser -> init-device-perms
    base -> init-envfile
    base -> init-migrations
    init-config-end -> init-mods
    init-mods-package-install -> init-mods-end
    init-mods -> init-mods-package-install
    init-adduser -> init-os-end
    init-device-perms -> init-os-end
    init-envfile -> init-os-end
    init-custom-files -> init-services
    init-wireguard-module -> init-wireguard-confs
    init-config -> init-wireguard-module
    init-services -> svc-coredns
    svc-coredns -> legacy-services
    init-services -> svc-cron
    svc-cron -> legacy-services
    svc-coredns -> svc-wireguard
    svc-wireguard -> legacy-services
  }
  Base Images: {
    "baseimage-alpine:3.24"
  }
  "wireguard:latest" <- Base Images
# changelog
changelogs:
  - {date: "17.08.26:", desc: "**Potentially Breaking Change:** Upgrade to AmneziaWG 3.1. Generated configs now include the new `RandomTrailers` and `DisableCookies` parameters (both enabled, matching the official Amnezia client defaults). Existing installs are migrated automatically on first start, but **existing peers must re-import their configs** to connect."}
  - {date: "08.08.26:", desc: "**Potentially Breaking Change:** Replace WireGuard with AmneziaWG (AWG 3.0). The image now ships `awg`/`awg-quick` and the `amneziawg-go` userspace implementation instead of wireguard-tools, and falls back to userspace mode when the amneziawg kernel module is not available (requires `/dev/net/tun`). Generated server and peer confs now include AWG 3.0 obfuscation parameters (Jc/Jmin/Jmax, S1-S4, H1-H4, HeaderProtectionKey, content padding, timings) generated once per server and stored in `/config/server/awgparams`. Existing configs are migrated automatically on first start; peer confs are compatible with the Amnezia VPN clients."}
